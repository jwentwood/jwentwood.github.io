<!doctype html>
<meta charset="utf-8">

<input id="file" type="file" accept="image/png">
<a id="download" hidden>Download WebP</a>
<p id="status"></p>

<script type="module">
import { encode } from "https://esm.sh/@jsquash/webp@1.5.0";

const input = document.querySelector("#file");
const download = document.querySelector("#download");
const status = document.querySelector("#status");

input.addEventListener("change", async () => {
  try {
    status.textContent = "Converting...";
    download.hidden = true;

    const image = await createImageBitmap(input.files[0]);
    const canvas = document.createElement("canvas");
    canvas.width = image.width;
    canvas.height = image.height;
    canvas.getContext("2d").drawImage(image, 0, 0);

    const pixels = canvas.getContext("2d").getImageData(
      0, 0, canvas.width, canvas.height
    );

    const data = await encode(pixels, { lossless: 1 });
    const blob = new Blob([data], { type: "image/webp" });

    download.href = URL.createObjectURL(blob);
    download.download = input.files[0].name.replace(/\.png$/i, ".webp");
    download.textContent = "Download WebP";
    download.hidden = false;
    status.textContent = "Done";
  } catch (error) {
    status.textContent = "Error: " + error.message;
    console.error(error);
  }
});
</script>
