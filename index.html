<style>
  :root {
    --md-sys-color-primary: #9C4A3A;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #FFDAD4;
    --md-sys-color-on-primary-container: #3F0300;
    --md-sys-color-secondary: #8C5E55;
    --md-sys-color-secondary-container: #FFDAD4;
    --md-sys-color-on-secondary-container: #3B0907;
    --md-sys-color-tertiary: #A07040;
    --md-sys-color-tertiary-container: #FFDDB8;
    --md-sys-color-surface: #FFF8F6;
    --md-sys-color-surface-variant: #F5DDDA;
    --md-sys-color-on-surface: #231917;
    --md-sys-color-on-surface-variant: #534340;
    --md-sys-color-outline: #857370;
    --md-sys-color-outline-variant: #D8C2BE;
    --md-sys-color-background: #FFF8F6;
    --md-sys-color-surface-container: #FAEAE7;
    --md-sys-color-surface-container-high: #F5E4E1;
    --md-sys-color-surface-container-highest: #EFDEDA;
    --md-elevation-1: 0px 1px 2px rgba(0,0,0,0.2), 0px 1px 3px 1px rgba(0,0,0,0.1);
    --md-elevation-2: 0px 1px 2px rgba(0,0,0,0.2), 0px 2px 6px 2px rgba(0,0,0,0.1);
    --md-elevation-3: 0px 4px 8px 3px rgba(0,0,0,0.1), 0px 1px 3px rgba(0,0,0,0.2);
    --md-shape-corner-full: 50px;
    --md-shape-corner-extra-large: 28px;
    --md-shape-corner-large: 16px;
    --md-shape-corner-medium: 12px;
    --md-shape-corner-small: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }

  body {
    font-family: 'Google Sans', sans-serif;
    background: var(--md-sys-color-background);
    color: var(--md-sys-color-on-surface);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    padding: clamp(8px, 2vh, 20px) clamp(12px, 3vw, 24px);
    overflow-y: auto;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,180,160,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(255,210,180,0.14) 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(220,140,110,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.2vh, 16px);
    align-items: center;
    padding-top: clamp(8px, 2vh, 20px);
    padding-bottom: clamp(8px, 2vh, 20px);
  }

  /* Profile card */
  .profile-card {
    background: var(--md-sys-color-surface-container);
    border-radius: var(--md-shape-corner-extra-large);
    padding: clamp(12px, 2vh, 24px) clamp(16px, 3vw, 28px);
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.6vh, 18px);
    box-shadow: var(--md-elevation-2);
    animation: slide-up 0.5s cubic-bezier(0.05, 0.7, 0.1, 1) both;
  }

  /* Top row: avatar + name side by side, centered */
  .profile-top {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3vw, 24px);
  }

  .avatar-wrap {
    flex-shrink: 0;
    width: clamp(72px, 13vh, 108px);
    height: clamp(72px, 13vh, 108px);
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  .profile-name {
    font-family: 'Google Sans Display', sans-serif;
    font-size: clamp(30px, 7vw, 48px);
    font-weight: 700;
    color: var(--md-sys-color-on-surface);
    letter-spacing: -0.3px;
    line-height: 1.1;
    word-break: break-word;
  }

  /* Blurb below */
  .profile-blurb {
    font-size: clamp(13px, 1.9vh, 16px);
    font-weight: 400;
    line-height: 1.55;
    color: var(--md-sys-color-on-surface-variant);
  }

  /* Section card */
  .section-card {
    background: var(--md-sys-color-surface-container);
    border-radius: var(--md-shape-corner-extra-large);
    padding: clamp(10px, 1.8vh, 20px) clamp(14px, 2.5vw, 24px) clamp(12px, 2vh, 22px);
    width: 100%;
    box-shadow: var(--md-elevation-2);
    animation: slide-up 0.5s cubic-bezier(0.05, 0.7, 0.1, 1) both;
  }

  .section-card:nth-child(2) { animation-delay: 0.08s; }
  .section-card:nth-child(3) { animation-delay: 0.14s; }
  .section-card:nth-child(4) { animation-delay: 0.20s; }

  .section-label {
    font-size: clamp(12px, 1.6vh, 15px);
    font-weight: 500;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--md-sys-color-primary);
    margin-bottom: clamp(8px, 1.4vh, 16px);
    padding: 0 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1.5px;
    background: var(--md-sys-color-outline-variant);
    border-radius: 1px;
  }

  /* Icon grid */
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: clamp(12px, 3vw, 20px);
    width: 100%;
  }

  .icon-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(5px, 0.8vh, 8px);
    text-decoration: none;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    width: 100%;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-surface {
    width: 100%;
    aspect-ratio: 1;
    border-radius: clamp(14px, 2vw, 20px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.2s cubic-bezier(0.05, 0.7, 0.1, 1),
                transform 0.2s cubic-bezier(0.05, 0.7, 0.1, 1);
    box-shadow: var(--md-elevation-2);
  }

  .icon-surface::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: currentColor;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .icon-btn:hover .icon-surface { box-shadow: var(--md-elevation-3); transform: translateY(-2px); }
  .icon-btn:hover .icon-surface::after { opacity: 0.08; }
  .icon-btn:active .icon-surface { transform: scale(0.94) translateY(0); box-shadow: var(--md-elevation-1); }
  .icon-btn:active .icon-surface::after { opacity: 0.12; }

  .icon-surface img, .icon-surface svg {
    width: 70%;
    height: 70%;
    object-fit: contain;
    position: relative;
    z-index: 1;
  }

  .icon-label {
    font-size: clamp(12px, 1.8vh, 15px);
    font-weight: 400;
    color: var(--md-sys-color-on-surface);
    text-align: center;
    line-height: 1.2;
  }

  .surf-primary-soft {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-primary);
  }

  /* Donate section */
  .section-donate .section-label { color: var(--md-sys-color-tertiary); }
  .section-donate .section-label::after { background: var(--md-sys-color-outline-variant); }

  .paypal-btn {
    margin-top: clamp(10px, 1.6vh, 18px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: clamp(12px, 1.8vh, 16px) clamp(16px, 2vw, 24px);
    background: var(--md-sys-color-tertiary-container);
    color: var(--md-sys-color-on-surface);
    border: none;
    border-radius: var(--md-shape-corner-large);
    box-shadow: var(--md-elevation-2);
    text-decoration: none;
    font-family: 'Google Sans', sans-serif;
    font-size: clamp(14px, 2vh, 16px);
    font-weight: 500;
    letter-spacing: 0.1px;
    cursor: pointer;
    transition: box-shadow 0.2s cubic-bezier(0.05, 0.7, 0.1, 1),
                transform 0.2s cubic-bezier(0.05, 0.7, 0.1, 1);
    position: relative;
    overflow: hidden;
  }

  .paypal-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: currentColor;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .paypal-btn:hover { box-shadow: var(--md-elevation-3); transform: translateY(-2px); }
  .paypal-btn:hover::after { opacity: 0.06; }
  .paypal-btn:active { transform: scale(0.98); box-shadow: var(--md-elevation-1); }
  .paypal-btn:active::after { opacity: 0.1; }

  .paypal-btn img {
    height: 22px;
    width: auto;
    object-fit: contain;
  }

  .paypal-btn + .paypal-btn {
    margin-top: clamp(8px, 1.2vh, 12px);
  }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
